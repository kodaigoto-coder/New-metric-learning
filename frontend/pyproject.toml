[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-learning-frontend"
version = "0.1.0"
description = "Streamlit Frontend for Phase 1 Cluster Annotation, Phase 2 MS-Loss+XBM Training, and Step 6 3-Axis Space Evaluation"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "Pillow>=10.2.0",
]
